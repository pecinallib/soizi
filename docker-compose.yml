services:
  postgres:
    image: postgres:16-alpine
    container_name: soizi-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soizi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soizi123}
      POSTGRES_DB: ${POSTGRES_DB:-soizi}
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: soizi-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./docker-data/redis:/data
